server:
  port: 8083
spring:
  config.import: optional:configserver:http://${CONFIG_SERVER_HOST:config-server}:8888
  application:
    name: recommendation-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:3306/fitness_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:fitness_user}
    password: ${MYSQL_PASSWORD:fitnesspassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://keycloak:8180/realms/fitness-platform/protocol/openid-connect/certs}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://ollama:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:tinyllama}
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:eureka-server}:8761/eureka/
  instance:
    prefer-ip-address: true
