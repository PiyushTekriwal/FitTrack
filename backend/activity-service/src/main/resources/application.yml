server:
  port: 8082
spring:
  config.import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888
  application:
    name: activity-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/fitness_activities?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:fitness_user}
    password: ${MYSQL_PASSWORD:fitnesspassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
